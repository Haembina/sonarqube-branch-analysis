# Dependabot keeps every third-party action current. Each one is pinned to a
# commit sha with its release beside it as `# vX.Y.Z`; this moves that pin,
# rewriting the sha and the comment in one pull request.
#
# Gradle too, since the jar ships its dependencies shaded inside it: an update
# there reaches every server that installs the plugin.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request per week rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
    # Haembina's own workflows are pinned to a release tag, which moves with
    # that release rather than with Dependabot.
    ignore:
      - dependency-name: "Haembina/*"
    # `build(deps)`: a workflow change reaches no user, so it releases nothing.
    commit-message:
      prefix: "build"
      include: "scope"
