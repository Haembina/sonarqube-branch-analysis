sonar.projectKey=Haembina_haembina-branch-analysis
sonar.projectName=Haembina Branch Analysis

# sonar.projectVersion is passed by verify.yml from package.json, so the
# new-code period moves with each release.

# The plugin's Java, the webapp addons' TypeScript, the shell scripts and the
# release and lint configuration. The images under src/main/resources/static
# are read as UTF-8 text when indexed, so they stay out.
sonar.sources=src/main,sonarqube-webapp-addons,scripts,docker,release.config.mjs,eslint.config.mjs
sonar.tests=src/test
sonar.exclusions=**/*.png,**/*.svg
sonar.sourceEncoding=UTF-8

# `npm test` runs the Gradle suite, which compiles into build/classes, writes
# the JaCoCo report and copies the plugin's other jars into
# build/sonar-libraries. The Java analyzer resolves types against those and the
# SonarQube distribution Gradle extracts into sonarqube-lib; without them every
# SonarQube type is unknown and the rules that need types stay silent.
sonar.java.source=21
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.java.libraries=sonarqube-lib/**/*.jar,build/sonar-libraries/*.jar
sonar.java.test.libraries=sonarqube-lib/**/*.jar,build/sonar-libraries/*.jar
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
